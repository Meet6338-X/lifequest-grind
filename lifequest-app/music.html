<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus tunes</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      background: #17140d; color: #f5efe2;
      display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; font-weight: 800; font-size: 14px;
    }
    .eq { display: inline-flex; gap: 2.5px; align-items: flex-end; height: 14px; }
    .eq i { width: 4px; background: #12b3a4; border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: 0.2s; } .eq i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes eq { 0%,100% { height: 5px; } 50% { height: 14px; } }
    .frame { flex: 1; position: relative; background: #000; }
    .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .empty { margin: auto; padding: 20px; text-align: center; color: #b9b2a4; font-size: 13px; }
  </style>
</head>
<body>
  <header><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span> Focus tunes</header>
  <div class="frame" id="frame"><div class="empty">No track linked.<br />Link one from the LifeQuest app first.</div></div>
  <script>
    // Tiny link parser (same shapes as the main app): video id, youtu.be,
    // watch?v=, shorts, playlist. Builds a plain embed, no API key.
    function parse(url) {
      const raw = (url || "").trim();
      if (!raw) return null;
      if (/^[\w-]{11}$/.test(raw)) return { videoId: raw };
      try {
        const u = new URL(raw, "https://x.invalid");
        const host = u.hostname.replace(/^www\./, "");
        if (host === "youtu.be") {
          const id = u.pathname.slice(1).split("/")[0];
          if (id) return { videoId: id };
        }
        if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
          const list = u.searchParams.get("list");
          const v = u.searchParams.get("v");
          if (u.pathname === "/watch" && v) return list ? { videoId: v, listId: list } : { videoId: v };
          if (u.pathname.startsWith("/playlist") && list) return { listId: list };
          if (u.pathname.startsWith("/shorts/")) {
            const id = u.pathname.split("/")[2];
            if (id) return { videoId: id };
          }
          if (list) return { listId: list };
        }
      } catch (e) { /* not a URL */ }
      return null;
    }
    (function boot() {
      const hash = location.hash.startsWith("#u=") ? decodeURIComponent(location.hash.slice(3)) : "";
      const p = parse(hash);
      if (!p) return;
      const src = p.listId && !p.videoId
        ? `https://www.youtube.com/embed/videoseries?list=${encodeURIComponent(p.listId)}&autoplay=1&rel=0`
        : `https://www.youtube.com/embed/${encodeURIComponent(p.videoId)}?autoplay=1&rel=0${p.listId ? `&list=${encodeURIComponent(p.listId)}` : ""}`;
      const frame = document.getElementById("frame");
      frame.innerHTML = "";
      const f = document.createElement("iframe");
      f.src = src;
      f.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
      f.allowFullscreen = true;
      frame.appendChild(f);
    })();
  </script>
</body>
</html>
